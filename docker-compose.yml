services:
  database:
    build:
      context: ./infrastructure/database
    container_name: geosense-database
    environment:
      POSTGRES_DB: geosense
      POSTGRES_USER: geosense
      POSTGRES_PASSWORD: geosense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geosense -d geosense"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
