repos:
  # ─────────────────────────────────────────────────────────────────────────
  # CAMADA 1 — Segredos e credenciais (detect-secrets)
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (credenciais e tokens)
        args:
          - --baseline
          - .secrets.baseline
        exclude: |
          (?x)^(
            .env.example|
            apps/api/uv\.lock|
            apps/frontend/package-lock\.json
          )$

  # ─────────────────────────────────────────────────────────────────────────
  # CAMADA 2 — PII em código-fonte (Presidio via hook local)
  # ─────────────────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: presidio-pii-scan
        name: presidio (PII em código-fonte)
        language: python
        entry: python tools/presidio_hook.py
        types_or: [python, ts, tsx]
        exclude: |
          (?x)^(
            apps/api/tests/|
            apps/frontend/src/.*\.test\.tsx?$|
            apps/frontend/src/.*__mocks__|
            StudyGeoSense/|
            study-GeoSense/
          )

  # ─────────────────────────────────────────────────────────────────────────
  # CAMADA 3 — Qualidade e higiene geral
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: no-commit-to-branch
        name: bloqueia commit direto em main
        args: [--branch, main]
      - id: detect-private-key
        name: detecta chaves privadas (RSA, EC, PEM)

  # ─────────────────────────────────────────────────────────────────────────
  # CAMADA 4 — Validação de arquivos .env
  # ─────────────────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: block-dotenv
        name: bloqueia .env com valores reais
        language: pygrep
        entry: '^[A-Z_]+=\S'
        types: [text]
        files: '^\.env$'
